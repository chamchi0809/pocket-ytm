name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to release
        required: true
        type: string
      replace_assets:
        description: Replace assets of an existing release (repair only)
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      UPDATE_SIGNING_KEY_BASE64: ${{ secrets.UPDATE_SIGNING_KEY_BASE64 }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up ARM64 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build-macos.txt

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          cargo_version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          tag_version=${RELEASE_TAG#v}
          if [[ "$cargo_version" != "$tag_version" ]]; then
            echo "Cargo version $cargo_version does not match tag $RELEASE_TAG" >&2
            exit 1
          fi
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"

      - name: Ensure release tag is unpublished
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "${{ inputs.replace_assets }}" != "true" ]]; then
              echo "Release $RELEASE_TAG already exists; published assets are immutable" >&2
              exit 1
            fi
            echo "Repair mode: existing assets will be replaced"
          fi

      - name: Add Apple Silicon Rust target
        run: rustup target add aarch64-apple-darwin

      - name: Install Python bridge dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-build-macos.txt

      - name: Test
        run: |
          cargo test --all-targets
          (cd backend && ../.venv/bin/python -m unittest test_ytmusic_bridge.py test_yt_dlp_resolver.py)

      - name: Build Apple Silicon release
        run: >-
          cargo build --release --target aarch64-apple-darwin
          --bin pocket-ytm --bin pocket-ytm-updater

      - name: Build self-contained runtime dependencies
        env:
          POCKET_YTM_BUILD_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: ./scripts/build-macos-dependencies.sh

      - name: Package app bundle
        env:
          POCKET_YTM_BINARY_DIR: ${{ github.workspace }}/target/aarch64-apple-darwin/release
          POCKET_YTM_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/package-macos.sh

      - name: Flatten bundle links for legacy updater compatibility
        shell: bash
        run: |
          set -euo pipefail
          flat_root=$(mktemp -d "$RUNNER_TEMP/pocket-flat-bundle.XXXXXX")
          /bin/cp -RL "dist/Pocket Music.app" "$flat_root/Pocket Music.app"
          if find "$flat_root/Pocket Music.app" -type l -print -quit | grep -q .; then
            echo "Flattened app still contains symbolic links" >&2
            exit 1
          fi
          mv "dist/Pocket Music.app" "$RUNNER_TEMP/Pocket Music.symlinked.app"
          mv "$flat_root/Pocket Music.app" "dist/Pocket Music.app"
          codesign --force --deep --sign - "dist/Pocket Music.app"

      - name: Verify app bundle
        shell: bash
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "dist/Pocket Music.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' 'dist/Pocket Music.app/Contents/Info.plist')" = "${{ steps.version.outputs.version }}"
          lipo "dist/Pocket Music.app/Contents/MacOS/pocket-ytm" -verify_arch arm64
          lipo "dist/Pocket Music.app/Contents/MacOS/pocket-ytm-updater" -verify_arch arm64
          for dependency in ffmpeg ffprobe deno; do
            tool="dist/Pocket Music.app/Contents/Resources/bin/$dependency"
            test -x "$tool"
            lipo "$tool" -verify_arch arm64
            if otool -L "$tool" | tail -n +2 | grep -E '/opt/homebrew|/usr/local|/Users/'; then
              echo "$dependency is not self-contained" >&2
              exit 1
            fi
          done
          for dependency in pocket-ytm-bridge pocket-ytm-resolver; do
            tool="dist/Pocket Music.app/Contents/Resources/libexec/$dependency/$dependency"
            test -x "$tool"
            lipo "$tool" -verify_arch arm64
            if otool -L "$tool" | tail -n +2 | grep -E '/opt/homebrew|/usr/local|/Users/'; then
              echo "$dependency is not self-contained" >&2
              exit 1
            fi
          done
          PATH=/usr/bin:/bin 'dist/Pocket Music.app/Contents/Resources/bin/ffmpeg' -version
          PATH=/usr/bin:/bin 'dist/Pocket Music.app/Contents/Resources/bin/deno' --version
          response=$(printf '%s\n' '{"id":1,"op":"authStatus","params":{}}' | PATH=/usr/bin:/bin 'dist/Pocket Music.app/Contents/Resources/libexec/pocket-ytm-bridge/pocket-ytm-bridge' --language ko --location KR --auth "$RUNNER_TEMP/pocket-music-test-auth.json")
          python3 -c 'import json,sys; value=json.loads(sys.argv[1]); assert value["id"] == 1 and value["ok"]' "$response"
          resolver_response=$(printf '%s\n' '{"id":1,"op":"ping"}' | PATH=/usr/bin:/bin 'dist/Pocket Music.app/Contents/Resources/libexec/pocket-ytm-resolver/pocket-ytm-resolver' --deno 'dist/Pocket Music.app/Contents/Resources/bin/deno')
          python3 -c 'import json,sys; value=json.loads(sys.argv[1]); assert value["id"] == 1 and value["ok"] and value["data"]["version"] == "2026.07.04"' "$resolver_response"

      - name: Archive app
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          asset="Pocket-Music-v${{ steps.version.outputs.version }}-macos-aarch64.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/Pocket Music.app" "$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Generate signed update manifest
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$UPDATE_SIGNING_KEY_BASE64" ]]; then
            echo "UPDATE_SIGNING_KEY_BASE64 repository secret is required" >&2
            exit 1
          fi
          python3 scripts/generate-update-manifest.py \
            --repository "$GITHUB_REPOSITORY" \
            --version "${{ steps.version.outputs.version }}" \
            --asset "${{ steps.archive.outputs.asset }}" \
            --output update-manifest.json
          cargo run --quiet --bin sign-update -- \
            update-manifest.json update-manifest.json.sig
          test "$(stat -f '%z' update-manifest.json.sig)" = 64

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "${{ steps.archive.outputs.asset }}" \
              update-manifest.json \
              update-manifest.json.sig \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              "${{ steps.archive.outputs.asset }}" \
              update-manifest.json \
              update-manifest.json.sig \
              --verify-tag \
              --generate-notes \
              --title "Pocket Music $RELEASE_TAG"
          fi

      - name: Verify published update metadata
        shell: bash
        run: |
          set -euo pipefail
          verify_dir=$(mktemp -d "$RUNNER_TEMP/pocket-published-release.XXXXXX")
          nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          curl --fail --location --retry 5 \
            --header 'Cache-Control: no-cache, no-store' \
            "$base/update-manifest.json?pocket-cache-bust=$nonce" \
            --output "$verify_dir/update-manifest.json"
          curl --fail --location --retry 5 \
            --header 'Cache-Control: no-cache, no-store' \
            "$base/update-manifest.json.sig?pocket-cache-bust=$nonce" \
            --output "$verify_dir/update-manifest.json.sig"
          cmp update-manifest.json "$verify_dir/update-manifest.json"
          cmp update-manifest.json.sig "$verify_dir/update-manifest.json.sig"
